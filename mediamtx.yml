    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

  # Kamera 4
  cam4:
    source: rtsp://admin:password123@192.168.1.103:554/stream1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

  # Kamera 5
  cam5:
    source: rtsp://admin:password123@192.168.1.104:554/stream1
