# ==============================================================
# MediaMTX Configuration - Loewix CCTV
# ==============================================================
# Copy file ini ke VPS: /etc/mediamtx.yml
# Ganti IP/DDNS dan password sesuai kamera kamu
# ==============================================================

# Log level
logLevel: info
logDestinations: [stdout]

# ===== SERVER PORTS =====
# RTSP - untuk terima stream dari kamera
rtspAddress: :8554
rtspEncryption: "no"

# RTMP (opsional)
rtmpAddress: :1935

# HLS - untuk web player (website akan akses ini)
hlsAddress: :8888
hlsEncryption: "no"
hlsAlwaysRemux: no
hlsSegmentCount: 3
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsAllowOrigin: '*'

# WebRTC (opsional, latency rendah)
webrtcAddress: :8889

# API monitoring
apiAddress: :9997

# ===== PATHS - KONFIGURASI KAMERA =====
# Ganti source dengan RTSP URL kamera kamu
#
# FORMAT RTSP UMUM:
# Hikvision:  rtsp://user:pass@IP:554/Streaming/Channels/101
# Dahua:      rtsp://user:pass@IP:554/cam/realmonitor?channel=1&subtype=0
# Reolink:    rtsp://user:pass@IP:554/h264Preview_01_main
# TP-Link:    rtsp://user:pass@IP:554/stream1
# Uniview:    rtsp://user:pass@IP:554/media/video1
# DDNS:       rtsp://user:pass@nama.ddns.net:554/stream1

paths:
  # Kamera 1
  cam1:
    source: rtsp://admin:password123@192.168.1.100:554/stream1
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

  # Kamera 2
