# MediaMTX Configuration for Loewix CCTV Live Streaming (H.264 & H.265 / HEVC Engine)
api: yes
apiAddress: :9997

hlsAlwaysRemux: true
hlsAllowOrigins: ['*']
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsPartDuration: 500ms

paths:
  # ==========================================
  # EXISTING RTSP CAMERAS (TESS, JAKARTA, BALI)
  # ==========================================
  cctv_loewix_1:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=1&stream=0.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_1_sub:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=1&stream=1.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_2:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=2&stream=0.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_2_sub:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=2&stream=1.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_3:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=3&stream=0.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_3_sub:
    source: rtsp://103.164.101.50:8203/user=admin&password=admin1234&channel=3&stream=1.sdp
    rtspTransport: tcp
    sourceOnDemand: yes

  cctv_loewix_h264:
    source: publisher

  # ==========================================
  # RTSP LOCAL (Office LAN 192.168.11.182)
  # ==========================================
  cam_live_5018:
    runOnInit: ffmpeg -nostdin -loglevel error -rtsp_transport tcp -timeout 8000000 -i "rtsp://192.168.11.182:554/user=admin&password=&channel=1&stream=1.sdp" -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r 20 -fps_mode cfr -g 40 -keyint_min 40 -sc_threshold 0 -b:v 800k -maxrate 1000k -bufsize 2000k -an -f rtsp -pkt_size 1316 -rtsp_transport tcp rtsp://127.0.0.1:8554/cam_live_5018
    runOnInitRestart: yes

  cam_live_5018_hd:
    runOnDemand: ffmpeg -nostdin -loglevel error -rtsp_transport tcp -timeout 8000000 -i "rtsp://192.168.11.182:554/user=admin&password=&channel=1&stream=0.sdp" -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -r 20 -fps_mode cfr -g 40 -keyint_min 40 -sc_threshold 0 -b:v 2500k -maxrate 3000k -bufsize 6000k -an -f rtsp -pkt_size 1316 -rtsp_transport tcp rtsp://127.0.0.1:8554/cam_live_5018_hd
    runOnDemandRestart: yes

